<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DreamWebsites</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f111a; --text-primary: #f0f6fc; --text-secondary: #8b949e;
            --accent-primary: #3b82f6; --gradient-primary: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08);
        }
        body { background-color: var(--bg-primary); color: var(--text-primary); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .signup-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .form-control { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white; border-radius: 10px; padding: 12px; }
        .form-control:focus { background: rgba(255,255,255,0.08); border-color: var(--accent-primary); color: white; box-shadow: none; }
        .btn-premium { background: var(--gradient-primary); border: none; border-radius: 10px; padding: 12px; font-weight: 600; width: 100%; transition: 0.3s; color: white; }
        .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4); }
        .text-gradient { background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    </style>
</head>
<body>
<div class="signup-card text-center">
    <a href="demo.html" class="d-block mb-4 text-decoration-none">
        <h3 class="fw-bold"><i class="fas fa-globe text-primary"></i> <span class="text-gradient">DreamWebsites</span></h3>
    </a>
    <h4 class="mb-4">Create Your Account</h4>
    <form>
        <div class="row mb-3">
            <div class="col text-start">
                <label class="form-label small text-secondary">First Name</label>
                <input type="text" class="form-control" placeholder="John">
            </div>
            <div class="col text-start">
                <label class="form-label small text-secondary">Last Name</label>
                <input type="text" class="form-control" placeholder="Doe">
            </div>
        </div>
        <div class="mb-3 text-start">
            <label class="form-label small text-secondary">Email Address</label>
            <input type="email" class="form-control" placeholder="john@example.com">
        </div>
        <div class="mb-4 text-start">
            <label class="form-label small text-secondary">Password</label>
            <input type="password" class="form-control" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-premium mb-3">Join Now</button>
        <p class="small text-secondary">Already have an account? <a href="login.html" class="text-primary text-decoration-none">Sign In</a></p>
    </form>
</div>
</body>
</html>
