<head>

    <style>
        :root {
            --bg-primary: #0f111a;
            --bg-secondary: #161b22;
            --bg-tertiary: #1f242e;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --gradient-primary: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --gradient-success: linear-gradient(135deg, #059669, #10b981);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-premium {
            background: rgba(15, 17, 26, 0.8) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            sticky;
            top: 0;
            z-index: 1000;
        }

        .text-gradient {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
            transition: 0.3s;
        }

        .site-card {
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: 0.3s;
        }

        .site-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 24px 60px rgba(99, 102, 241, 0.22);
        }

        .card-carousel {
            height: 200px;
            overflow: hidden;
        }

        .card-carousel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-premium {
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 12px 28px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-premium-outline {
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--accent-primary);
            border-radius: 50px;
            padding: 10px 26px;
            font-weight: 600;
        }

        footer {
            border-top: 1px solid var(--glass-border);
            background: var(--bg-secondary);
            margin-top: auto;
        }
    </style>
</head>

            <div class="modal-content glass-panel border-0"
                style="background: rgba(15, 17, 26, 0.98); backdrop-filter: blur(30px);">
                <div class="modal-header border-0 pb-0">
                    <div>
                        <h4 class="modal-title fw-bold text-white mb-1" id="viewModalLabel">Website Preview</h4>
                        <p class="text-secondary small mb-0" id="viewModalCategory">Premium Listing</p>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row g-4">
                        <div class="col-lg-8">
                            <div id="carouselExample" class="carousel slide rounded-4 overflow-hidden shadow-lg" data-bs-ride="carousel">
                                <div class="carousel-inner" id="modalCarouselInner">
                                    <!-- Images injected here -->
                                </div>
                                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                                    data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                                    data-bs-slide="next">
                                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                </button>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="p-3 glass-panel h-100">
                                <h5 class="fw-bold mb-3">Gallery</h5>
                                <div class="row g-2" id="thumbnailStrip">
                                    <!-- Thumbnails injected here -->
                                </div>
                                <hr class="my-4 opacity-10">
                                <h5 class="fw-bold mb-3">Description</h5>
                                <p id="modalDescription" class="text-secondary small mb-4"></p>
                                <div class="d-grid gap-2">
                                    <a id="modalVisitBtn" href="#" target="_blank" class="btn btn-premium w-100">Visit Live Site</a>
                                    <button class="btn btn-premium-outline w-100" data-bs-dismiss="modal">Close Preview</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        // ========== RENDER WEBSITES ==========
        function renderWebsites() {
            const grid = document.getElementById('websitesGrid');
            grid.innerHTML = websiteData.map(site => `
                <div class="col-md-6 col-lg-4">
                    <div class="glass-panel site-card">
                        <div class="card-carousel">
                            <img src="${site.mainImage}" alt="${site.name}">
                            <div class="badge bg-primary position-absolute top-0 end-0 m-3">${site.category}</div>
                        </div>
                        <div class="p-4 flex-grow-1">
                            <div class="d-flex justify-content-between mb-2">
                                <h5 class="fw-bold">${site.name}</h5>
                                <span class="badge bg-success">${site.price}</span>
                            </div>
                            <p class="text-secondary small">${site.description}</p>
                            <div class="d-flex gap-2 mt-3">
                                <button class="btn btn-premium-outline w-100" onclick="viewWebsite(${site.id})">View</button>
                                <a href="${site.visitUrl}" target="_blank" class="btn btn-premium w-100 text-center py-2">Visit</a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ========== MODAL LOGIC ==========
        function viewWebsite(id) {
            const site = websiteData.find(s => s.id === id);
            if (!site) return;

            const modalTitle = document.getElementById('viewModalLabel');
            const modalCategory = document.getElementById('viewModalCategory');
            const carouselInner = document.getElementById('modalCarouselInner');
            const thumbnailStrip = document.getElementById('thumbnailStrip');
            const modalDescription = document.getElementById('modalDescription');
            const modalVisitBtn = document.getElementById('modalVisitBtn');

            modalTitle.innerText = site.name;
            modalCategory.innerText = site.category;
            modalDescription.innerText = site.description;
            modalVisitBtn.href = site.visitUrl;

            // Render Carousel
            carouselInner.innerHTML = site.gallery.map((img, index) => `
                <div class="carousel-item ${index === 0 ? 'active' : ''}">
                    <img src="${img}" class="d-block w-100" style="height: 450px; object-fit: cover;" alt="Preview">
                </div>
            `).join('');

            // Render Thumbnails
            thumbnailStrip.innerHTML = site.gallery.map((img, index) => `
                <div class="col-3">
                    <img src="${img}" class="img-fluid rounded cursor-pointer ${index === 0 ? 'border border-primary' : 'opacity-75'}" 
                         style="height: 60px; width: 100%; object-fit: cover; cursor: pointer;"
                         onclick="goToSlide(${index}, this)" alt="Thumbnail">
                </div>
            `).join('');

            const modal = new bootstrap.Modal(document.getElementById('viewModal'));
            modal.show();
        }

        function goToSlide(index, element) {
            const carousel = new bootstrap.Carousel(document.getElementById('carouselExample'));
            carousel.to(index);
            
            // Update thumbnail borders
            document.querySelectorAll('#thumbnailStrip img').forEach(img => {
                img.classList.remove('border', 'border-primary');
                img.classList.add('opacity-75');
            });
            element.classList.add('border', 'border-primary');
            element.classList.remove('opacity-75');
        }

        // Initial render
        renderWebsites();
    </script>
